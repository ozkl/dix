<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Disk Image Explorer</title>
    <!-- Built with `trunk build --release` from this directory. -->
    <link data-trunk rel="icon" href="assets/icon-256.png" />
    <link data-trunk rel="rust" data-bin="disk-image-explorer" data-wasm-opt="2" />
    <!-- The licenses, next to the page (the app shows them too). -->
    <link data-trunk rel="copy-file" href="../../LICENSE" />
    <link data-trunk rel="copy-file" href="../../THIRD-PARTY-LICENSES.txt" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
        #loading_text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                        color: #aaa; font-family: sans-serif; font-size: 16px; }
    </style>

    <canvas id="the_canvas_id"></canvas>
    <div id="loading_text">Loading…</div>
