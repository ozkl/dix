<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Disk Image Explorer: a disc (the image) tucked into an open folder
       (the explorer), on a rounded tile laid out on Apple's icon grid
       (an 824 px tile in a 1024 px canvas). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.45" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <!-- The rainbow sheen of a disc's surface. -->
    <linearGradient id="sheen" x1="0.1" y1="0.2" x2="0.9" y2="0.8">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#F472B6" stop-opacity="0.5"/>
      <stop offset="0.75" stop-color="#FDE047" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FDE047" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1437" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7C2D12" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- The tile. -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <g clip-path="url(#tileClip)">
    <!-- Folder, back panel with its tab. -->
    <path d="M222 340 a36 36 0 0 1 36 -36 h160 a36 36 0 0 1 28 13 l34 41 h270 a36 36 0 0 1 36 36 v380
             a36 36 0 0 1 -36 36 h-492 a36 36 0 0 1 -36 -36 z"
          fill="url(#folderBack)"/>
    <path d="M258 322 h156" stroke="#FDE68A" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>

    <!-- The disc, half in the folder. -->
    <g filter="url(#soft)">
      <circle cx="566" cy="478" r="196" fill="url(#disc)"/>
      <circle cx="566" cy="478" r="196" fill="url(#sheen)"/>
      <circle cx="566" cy="478" r="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
      <circle cx="566" cy="478" r="58" fill="#E2E8F0"/>
      <circle cx="566" cy="478" r="58" fill="none" stroke="#94A3B8" stroke-width="5"/>
      <circle cx="566" cy="478" r="23" fill="#1E3A8A"/>
    </g>

    <!-- Folder, front panel (slightly tilted open). -->
    <g filter="url(#soft)">
      <path d="M206 538 a30 30 0 0 1 30 -28 h552 a30 30 0 0 1 30 33 l-26 238 a36 36 0 0 1 -36 32 h-488
               a36 36 0 0 1 -36 -32 z"
            fill="url(#folderFront)"/>
      <path d="M236 528 h552" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- A magnifying glass: exploring. -->
    <g filter="url(#shadow)">
      <line x1="718" y1="752" x2="806" y2="840" stroke="#1E293B" stroke-width="46" stroke-linecap="round"/>
      <line x1="718" y1="752" x2="806" y2="840" stroke="#475569" stroke-width="30" stroke-linecap="round"/>
      <circle cx="642" cy="676" r="104" fill="#E0F2FE" fill-opacity="0.55"/>
      <circle cx="642" cy="676" r="104" fill="none" stroke="#F8FAFC" stroke-width="26"/>
      <circle cx="642" cy="676" r="104" fill="none" stroke="#CBD5E1" stroke-width="6"/>
      <path d="M582 632 a74 74 0 0 1 58 -36" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>
</svg>
