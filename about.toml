# cargo-about: the licenses accepted in the app's dependencies, and the
# platforms it is built for. scripts/third-party-licenses.sh writes
# THIRD-PARTY-LICENSES.txt from this and about.hbs.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "bzip2-1.0.6",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "wasm32-unknown-unknown",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
# This project's own crates are not third-party.
private = { ignore = true }
